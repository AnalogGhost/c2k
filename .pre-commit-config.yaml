# Blocks commits that contain secrets (API keys, signing material, tokens).
# Uses the system gitleaks; install hooks once per clone with: pre-commit install
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks (staged changes)
        entry: gitleaks git --pre-commit --staged --redact --no-banner
        language: system
        pass_filenames: false
